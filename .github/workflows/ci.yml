name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check --select E9,F app ml scripts tests
      - name: Migrations apply on clean DB
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./ci.db
        run: python -m alembic upgrade head
      - name: Tests (offline, no API keys)
        run: python -m pytest -q
      - name: RAG eval report
        run: python -m scripts.eval_rag

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Tests (jsdom page tests for /ml, /faq, /assistant)
        run: npm test
      - run: npm run build
